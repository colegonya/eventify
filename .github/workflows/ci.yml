name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only one event fires per commit: pull_request for branches, push for main.
# The group still collapses superseded runs when commits land in quick
# succession. head_ref (pull_request) and ref_name (push) are both the plain
# branch name, so a branch keeps one group across both events.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Coverage, not a bare test run: CLAUDE.md and TESTING.md both set a
      # coverage goal, and until something measured it, the goal was prose. The
      # threshold covers src/lib's pure logic — see vitest.config.mjs for why
      # data.js and actions.js are measured in the browser instead.
      - run: npm run test:coverage

      # Production dependencies only. Dev-only advisories don't reach a
      # deployment, and gating on them would make this step noise that gets
      # ignored, which is worse than not running it.
      - run: npm audit --omit=dev

      - run: npm run build
        env:
          # Placeholder values so the app's required-env-var check passes in CI.
          # Real values live in Vercel's project settings, never here.
          SITE_PASSCODE: ci-placeholder
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder-token
