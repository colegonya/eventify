name: CI

on:
  push:
  pull_request:
    branches: [main]

# A branch with an open PR fires both push and pull_request for the same
# commit. head_ref (set on pull_request) and ref_name (set on push) are both
# the plain branch name, so the two events share a group and the later one
# cancels the earlier. Superseded runs on a branch get cancelled the same way.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          # Placeholder values so the app's required-env-var check passes in CI.
          # Real values live in Vercel's project settings, never here.
          SITE_PASSCODE: ci-placeholder
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder-token
